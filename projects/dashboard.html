<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Para Análisis de Datos</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="project.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <header class="project-header">
        <a href="../index.html#portfolio" class="back-link" data-proj-lang-key="backToPortfolio">← Volver al portafolio</a>
    </header>

    <main class="project-main">
        <section class="project-hero">
            <h1 data-proj-lang-key="dashboardPageTitle">Dashboard Para Análisis de Datos</h1>
            <div class="project-tech">
                <span class="tech-tag">Power BI</span>
                <span class="tech-tag">Excel</span>
            </div>
            <div class="project-actions">
                <!-- Opcional: enlaces reales cuando los tengas -->
                <!-- <a href="https://github.com/tu-usuario/erp" target="_blank" class="btn-secondary">GitHub</a> -->
                <!-- <a href="https://demo-url.com" target="_blank" class="btn-primary">Ver demo</a> -->
            </div>
        </section>

        <section class="project-gallery-section">
            <h2 data-proj-lang-key="galleryTitle">Visualización del proyecto</h2>
            
            <div class="carousel-container">
                <div class="carousel-images" id="carousel">
                    <img src="../assets/images/projects/dash3.jpg" alt="Vista del sistema 1">
                    <img src="../assets/images/projects/dash2.jpg" alt="Vista del sistema 2">
                    <img src="../assets/images/projects/dash1.jpg" alt="Vista del sistema 3">
                </div>
                <div class="carousel-controls">
                    <button class="carousel-btn prev" id="prevBtn">❮</button>
                    <div class="carousel-counter" id="carouselCounter">1 / 3</div>
                    <button class="carousel-btn next" id="nextBtn">❯</button>
                </div>
            </div>
        </section>

    </main>

    <dialog class="image-dialog" id="image-dialog">
        <img alt="Vista ampliada" src="">
    </dialog>

    <script>
        // ===== Traducciones de página de proyecto =====
        const projectTranslations = {
            es: {
                dashboardPageTitle: 'Dashboard Para Análisis de Datos',
                galleryTitle: 'Visualización del proyecto',
                backToPortfolio: '← Volver al portafolio'
            },
            en: {
                dashboardPageTitle: 'Dashboard for Data Analysis',
                galleryTitle: 'Project Gallery',
                backToPortfolio: '← Back to portfolio'
            }
        };
        const projLang = localStorage.getItem('language') || 'es';
        document.querySelectorAll('[data-proj-lang-key]').forEach(el => {
            const key = el.getAttribute('data-proj-lang-key');
            if (projectTranslations[projLang] && projectTranslations[projLang][key] !== undefined) {
                el.textContent = projectTranslations[projLang][key];
            }
        });

        // Carrusel
        const carousel = document.getElementById('carousel');
        const images = carousel.querySelectorAll('img');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const counter = document.getElementById('carouselCounter');
        let currentIndex = 0;

        function updateCarousel() {
            carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
            counter.textContent = `${currentIndex + 1} / ${images.length}`;
        }

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex > 0) ? currentIndex - 1 : images.length - 1;
            updateCarousel();
        });

        nextBtn.addEventListener('click', () => {
            currentIndex = (currentIndex < images.length - 1) ? currentIndex + 1 : 0;
            updateCarousel();
        });

        updateCarousel(); // inicializar

        // Visor de imagen
        const dialog = document.getElementById('image-dialog');
        images.forEach(img => {
            img.addEventListener('click', () => {
                dialog.querySelector('img').src = img.src;
                dialog.showModal();
            });
        });
        dialog.addEventListener('click', e => {
            if (e.target === dialog) dialog.close();
        });
    </script>
</body>
</html>
